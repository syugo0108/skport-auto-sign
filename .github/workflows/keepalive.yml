name: Keepalive

# リポジトリが60日無活動になるとスケジュール済みワークフローが無効化される。
# スケジュール実行はリポジトリ活動にカウントされないため、定期的に空コミットを
# 打って活動を発生させ、無効化を防ぐ。
on:
  schedule:
    - cron: '0 0 * * *'    # 毎日（空コミットは50日以上無活動の時のみ）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Empty commit if repo idle >= 50 days
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "Days since last commit: $days"
          if [ "$days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive to prevent scheduled workflow disable"
            git push
          else
            echo "Repo active enough ($days days), no keepalive commit needed."
          fi
